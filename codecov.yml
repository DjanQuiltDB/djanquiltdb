# The coverage gates are the fail_under values in each package's pyproject.toml, which CI enforces in the coverage tox
# envs. The Codecov statuses only report, so that a pull request has one source of failure for coverage.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# One flag per package, which the README badges select with ?flag=.
flags:
  core:
    paths:
      - packages/djanquiltdb/src/
  celery:
    paths:
      - packages/djanquiltdb-plugin-celery/src/
  oauth-toolkit:
    paths:
      - packages/djanquiltdb-plugin-oauth-toolkit/src/
  pghistory:
    paths:
      - packages/djanquiltdb-plugin-pghistory/src/
  postgres-denormalize:
    paths:
      - packages/djanquiltdb-plugin-postgres-denormalize/src/
  postgres-objects:
    paths:
      - packages/djanquiltdb-plugin-postgres-objects/src/
