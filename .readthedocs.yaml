version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: packages/djanquiltdb
      extra_requirements:
        - docs
    - method: pip
      path: packages/djanquiltdb-plugin-postgres-objects
