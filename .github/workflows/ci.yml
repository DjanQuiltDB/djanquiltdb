name: CI

on:
  push:
    branches: [master]
    tags: ['v*', 'plugin-celery-v*', 'plugin-oauth-toolkit-v*', 'plugin-pghistory-v*', 'plugin-postgres-denormalize-v*', 'plugin-postgres-objects-v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The test job runs one job per test environment of tox.toml, so the matrix is read from tox rather than written out.
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip 'tox>=4.56.1'
      - id: matrix
        run: echo "include=$(python .github/scripts/test_matrix.py)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.toxenv }}
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The Codecov upload authenticates with a GitHub OIDC token, so the repository needs no Codecov token secret.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres2:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db2
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      DATABASE_URL2: postgresql://postgres:postgres@localhost:5433/test_db2
    steps:
      - uses: actions/checkout@v5
      # The coverage envs run on Python 3.14 in every job, so the py312, py313 and py315 jobs install it beside their
      # own Python. The version that is listed last is the one that runs tox.
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.14
            ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/*/pyproject.toml
      - run: python -m pip install --upgrade pip 'tox>=4.56.1'
      - run: tox -e ${{ matrix.toxenv }}
      - if: matrix.coverageenv
        run: tox -e ${{ matrix.coverageenv }}
      # Only the py315-dj61-pg18 job of each package uploads (see .github/scripts/test_matrix.py), so that each package
      # has one report, and the core report comes from the job that its gate is measured on. The upload also runs when
      # the coverage env fails its gate, so that the badge shows the drop. The coverage env writes coverage.xml before it
      # checks the gate.
      - if: ${{ !cancelled() && matrix.codecovflag }}
        uses: codecov/codecov-action@v5
        with:
          files: ${{ matrix.coveragexml }}
          flags: ${{ matrix.codecovflag }}
          use_oidc: true
          fail_ci_if_error: false

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: packages/*/pyproject.toml
      - run: python -m pip install --upgrade pip 'tox>=4.56.1'
      - run: tox -e ruff

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml
      - run: python -m pip install --upgrade pip pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: packages/*/pyproject.toml
      - run: python -m pip install --upgrade pip 'tox>=4.56.1'
      - run: tox -e docs

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: packages/*/pyproject.toml
      - run: python -m pip install --upgrade pip 'tox>=4.56.1'
      - run: tox -e core-build,celery-build,oauth-toolkit-build,pghistory-build,postgres-denormalize-build,postgres-objects-build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-djanquiltdb
          path: packages/djanquiltdb/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-plugin-celery
          path: packages/djanquiltdb-plugin-celery/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-plugin-oauth-toolkit
          path: packages/djanquiltdb-plugin-oauth-toolkit/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-plugin-pghistory
          path: packages/djanquiltdb-plugin-pghistory/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-plugin-postgres-denormalize
          path: packages/djanquiltdb-plugin-postgres-denormalize/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-plugin-postgres-objects
          path: packages/djanquiltdb-plugin-postgres-objects/dist/

  publish-core:
    name: publish djanquiltdb to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, pre-commit, docs, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-djanquiltdb
      url: https://pypi.org/p/djanquiltdb
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-djanquiltdb
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-plugin-celery:
    name: publish djanquiltdb-plugin-celery to PyPI
    if: startsWith(github.ref, 'refs/tags/plugin-celery-v')
    needs: [test, lint, pre-commit, docs, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-plugin-celery
      url: https://pypi.org/p/djanquiltdb-plugin-celery
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-plugin-celery
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-plugin-oauth-toolkit:
    name: publish djanquiltdb-plugin-oauth-toolkit to PyPI
    if: startsWith(github.ref, 'refs/tags/plugin-oauth-toolkit-v')
    needs: [test, lint, pre-commit, docs, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-plugin-oauth-toolkit
      url: https://pypi.org/p/djanquiltdb-plugin-oauth-toolkit
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-plugin-oauth-toolkit
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-plugin-pghistory:
    name: publish djanquiltdb-plugin-pghistory to PyPI
    if: startsWith(github.ref, 'refs/tags/plugin-pghistory-v')
    needs: [test, lint, pre-commit, docs, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-plugin-pghistory
      url: https://pypi.org/p/djanquiltdb-plugin-pghistory
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-plugin-pghistory
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-plugin-postgres-denormalize:
    name: publish djanquiltdb-plugin-postgres-denormalize to PyPI
    if: startsWith(github.ref, 'refs/tags/plugin-postgres-denormalize-v')
    needs: [test, lint, pre-commit, docs, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-plugin-postgres-denormalize
      url: https://pypi.org/p/djanquiltdb-plugin-postgres-denormalize
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-plugin-postgres-denormalize
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-plugin-postgres-objects:
    name: publish djanquiltdb-plugin-postgres-objects to PyPI
    if: startsWith(github.ref, 'refs/tags/plugin-postgres-objects-v')
    needs: [test, lint, pre-commit, docs, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-plugin-postgres-objects
      url: https://pypi.org/p/djanquiltdb-plugin-postgres-objects
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-plugin-postgres-objects
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
