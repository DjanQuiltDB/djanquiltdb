[env.core-build]
description = "Build the djanquiltdb sdist and wheel and check the metadata"
labels = ["core", "build"]
deps = ["build", "twine"]
change_dir = "{tox_root}/packages/djanquiltdb"
commands = [
    ["python", "-c", "import shutil; shutil.rmtree('dist', ignore_errors=True)"],
    ["python", "-m", "build"],
    ["twine", "check", "dist/*"],
]

