requires = ["tox>=4.56.1"]
env_list = [
    # The test environments: every suite on every combination of Python, Django and PostgreSQL in this list, except the
    # combinations that a suite does not support. Each combination runs on PostgreSQL 18, and only the newest one also
    # runs on PostgreSQL 17, because the Python and Django versions do not change how PostgreSQL behaves. Django 5.2
    # does not support Python 3.15, and the postgres-denormalize plugin requires Django 6.0.
    { product = [
        ["core", "core-pgtrigger", "celery", "oauth-toolkit", "pghistory", "postgres-denormalize", "postgres-objects"],
        [
            "py312-dj52-pg18",
            "py312-dj60-pg18",
            "py312-dj61-pg18",
            "py313-dj52-pg18",
            "py313-dj60-pg18",
            "py313-dj61-pg18",
            "py314-dj52-pg18",
            "py314-dj60-pg18",
            "py314-dj61-pg18",
            "py315-dj61-pg17",
            "py315-dj61-pg18",
        ],
    ], exclude = [
        "postgres-denormalize-py312-dj52-pg18",
        "postgres-denormalize-py313-dj52-pg18",
        "postgres-denormalize-py314-dj52-pg18",
    ] },
    "ruff",
    "docs",
    "core-coverage",
    "celery-coverage",
    "oauth-toolkit-coverage",
    "pghistory-coverage",
    "postgres-denormalize-coverage",
    "postgres-objects-coverage",
]

# The settings of the test environments, chosen by the factors of their names: the suite (core, pgtrigger, celery,
# oauth, pghistory, denormalize, objects), the Python version (py312), the Django version (dj52) and the PostgreSQL
# version (pg18). The other environments set their own values.
#
# Every env installs the packages it needs as editable path deps, so pip resolves the plugin's djanquiltdb pin
# against the in-tree checkout and the build backend never writes into the source tree.
[env_run_base]
# A test environment takes its Python from its name. The other environments run on Python 3.14.
default_base_python = ["python3.14"]
skip_install = true
pass_env = ["DATABASE_URL", "DATABASE_URL2"]
description = { replace = "if", condition = "factor.pgtrigger", then = "Run the suites that only run with django-pgtrigger installed", "else" = { replace = "if", condition = "factor.core", then = "Run the core test suite", "else" = { replace = "if", condition = "factor.celery", then = "Run the celery plugin suite", "else" = { replace = "if", condition = "factor.oauth", then = "Run the oauth-toolkit plugin suite", "else" = { replace = "if", condition = "factor.pghistory", then = "Run the pghistory plugin suite", "else" = { replace = "if", condition = "factor.denormalize", then = "Run the postgres-denormalize plugin suite", "else" = "Run the postgres-objects plugin suite" } } } } } }
labels = [
    { replace = "if", condition = "factor.core", then = ["core", "test"], extend = true },
    { replace = "if", condition = "factor.celery", then = ["celery", "test"], extend = true },
    { replace = "if", condition = "factor.oauth", then = ["oauth-toolkit", "test"], extend = true },
    { replace = "if", condition = "factor.pghistory", then = ["pghistory", "test"], extend = true },
    { replace = "if", condition = "factor.denormalize", then = ["postgres-denormalize", "test"], extend = true },
    { replace = "if", condition = "factor.objects", then = ["postgres-objects", "test"], extend = true },
]
deps = [
    { replace = "if", condition = "factor.dj52", then = ["Django>=5.2.19,<5.3"], extend = true },
    { replace = "if", condition = "factor.dj60", then = ["Django>=6.0,<6.1"], extend = true },
    { replace = "if", condition = "factor.dj61 and not factor.py315", then = ["Django>=6.1,<6.2"], extend = true },
    # Python 3.15 needs Django 6.1.3 or later.
    { replace = "if", condition = "factor.dj61 and factor.py315", then = ["Django>=6.1.3,<6.2"], extend = true },
    { replace = "if", condition = "factor.core", then = ["psycopg[binary]>=3.1.8"], extend = true },
    # Only the core-pgtrigger environments install it: pgtrigger is not a dependency of the package, it is what the
    # suites under test react to. The pin matches the version docs/database_objects/triggers.rst records as tested.
    { replace = "if", condition = "factor.pgtrigger", then = ["django-pgtrigger>=4.17,<5.0"], extend = true },
    { replace = "if", condition = "factor.core", then = ["-e {tox_root}/packages/djanquiltdb[test]"], extend = true },
    { replace = "if", condition = "not factor.core", then = ["-e {tox_root}/packages/djanquiltdb"], extend = true },
    { replace = "if", condition = "factor.celery", then = [
        "celery>=5.6,<6.0",
        "-e {tox_root}/packages/djanquiltdb-plugin-celery[test]",
    ], extend = true },
    { replace = "if", condition = "factor.oauth", then = [
        "django-oauth-toolkit>=3.4,<4.0",
        "-e {tox_root}/packages/djanquiltdb-plugin-oauth-toolkit[test]",
    ], extend = true },
    { replace = "if", condition = "factor.pghistory", then = [
        "django-pghistory>=3.9.2,<4.0",
        "-e {tox_root}/packages/djanquiltdb-plugin-pghistory[test]",
    ], extend = true },
    # POSTGRES_DENORMALIZE replaces the requirement of django-postgres-denormalize, for example with the path of a
    # checkout that is mounted into the container, to test the plugin against a version that is not on PyPI yet.
    { replace = "if", condition = "factor.denormalize", then = [
        "{env:POSTGRES_DENORMALIZE:django-postgres-denormalize>=1.1,<2.0}",
        "-e {tox_root}/packages/djanquiltdb-plugin-postgres-denormalize[test]",
    ], extend = true },
    { replace = "if", condition = "factor.objects", then = [
        "django-postgres-objects>=1.1,<2.0",
        "-e {tox_root}/packages/djanquiltdb-plugin-postgres-objects[test]",
    ], extend = true },
]
change_dir = { replace = "if", condition = "factor.core", then = "{tox_root}/packages/djanquiltdb/tests", "else" = { replace = "if", condition = "factor.celery", then = "{tox_root}/packages/djanquiltdb-plugin-celery/tests", "else" = { replace = "if", condition = "factor.oauth", then = "{tox_root}/packages/djanquiltdb-plugin-oauth-toolkit/tests", "else" = { replace = "if", condition = "factor.pghistory", then = "{tox_root}/packages/djanquiltdb-plugin-pghistory/tests", "else" = { replace = "if", condition = "factor.denormalize", then = "{tox_root}/packages/djanquiltdb-plugin-postgres-denormalize/tests", "else" = "{tox_root}/packages/djanquiltdb-plugin-postgres-objects/tests" } } } } }
# The pg17/pg18 factor picks the pair of database servers from docker-compose.yml; either URL can still be overridden
# from the outside.
set_env = { replace = "if", condition = "factor.pg17 or factor.pg18", then = { PYTHONWARNINGS = { replace = "if", condition = "not factor.core", then = "default" }, DJANGO_SETTINGS_MODULE = { replace = "if", condition = "factor.pgtrigger", then = "config.settings.pgtrigger", "else" = { replace = "if", condition = "factor.core", then = "config.settings.dev", "else" = "config.settings" } }, DATABASE_URL = { replace = "if", condition = "factor.pg17", then = "{env:DATABASE_URL:postgresql://postgres:postgres@postgres17:5432/test_db}", "else" = "{env:DATABASE_URL:postgresql://postgres:postgres@postgres18:5432/test_db}" }, DATABASE_URL2 = { replace = "if", condition = "factor.pg17", then = "{env:DATABASE_URL2:postgresql://postgres:postgres@postgres17-2:5432/test_db2}", "else" = "{env:DATABASE_URL2:postgresql://postgres:postgres@postgres18-2:5432/test_db2}" } }, "else" = {} }
# The coverage of each suite is measured with the coverage settings in the pyproject.toml of its package, one directory
# up from its tests.
commands = [
    { replace = "if", condition = "factor.core and not factor.pgtrigger", then = [
        [
            "coverage",
            "run",
            "--rcfile=../pyproject.toml",
            "manage.py",
            "test",
            "--noinput",
            # The test modules are named after what they cover rather than test_*, so discovery needs the wider pattern.
            "--pattern=*.py",
            # The suites are named rather than discovered from the working directory, so that pgtrigger_tests is left
            # out: it needs django-pgtrigger, which only the core-pgtrigger environments install. It skips itself on
            # import when the dependency is missing, but a skipped module cannot be handed to the --parallel workers, so
            # leaving it undiscovered is what keeps these runs clean. Passing labels as posargs replaces this list.
            { replace = "posargs", extend = true, default = ["djanquiltdb_tests", "example", "migration_tests"] },
            "--parallel",
        ],
    ], extend = true },
    # Only the two suites that need pgtrigger, so the core suite is not run a second time; the coverage of what they
    # reach is measured by the core environments, so these run without it.
    { replace = "if", condition = "factor.pgtrigger", then = [
        [
            "python",
            "manage.py",
            "test",
            "djanquiltdb_tests.checks",
            "pgtrigger_tests",
            "--noinput",
            "--pattern=*.py",
            { replace = "posargs", extend = true, default = [] },
        ],
    ], extend = true },
    { replace = "if", condition = "not factor.core", then = [
        [
            "coverage",
            "run",
            "--rcfile=../pyproject.toml",
            "manage.py",
            "test",
            "plugin_tests",
            "--noinput",
            "--pattern=*.py",
            { replace = "posargs", extend = true, default = [] },
        ],
    ], extend = true },
    # The pghistory suite again, with pghistory's Context table public, and once more with it mirrored. Its sharding
    # mode is fixed when the test database is migrated, so each takes a run of its own.
    { replace = "if", condition = "factor.pghistory", then = [
        [
            "coverage",
            "run",
            "--append",
            "--rcfile=../pyproject.toml",
            "manage.py",
            "test",
            "plugin_tests",
            "--noinput",
            "--pattern=*.py",
            "--settings=config.settings_public_context",
            { replace = "posargs", extend = true, default = [] },
        ],
        [
            "coverage",
            "run",
            "--append",
            "--rcfile=../pyproject.toml",
            "manage.py",
            "test",
            "plugin_tests",
            "--noinput",
            "--pattern=*.py",
            "--settings=config.settings_mirrored_context",
            { replace = "posargs", extend = true, default = [] },
        ],
    ], extend = true },
]

[env.ruff]
description = "Lint and check formatting across all packages and the docs"
labels = ["lint"]
deps = ["ruff==0.15.21"]
change_dir = "{tox_root}"
# One cache for the whole tree; without this, ruff drops a .ruff_cache next to every package's config, and inside the
# Docker container those become root-owned.
set_env = { RUFF_CACHE_DIR = "{tox_root}/.ruff_cache" }
commands = [
    ["ruff", "check", "packages", "docs"],
    ["ruff", "format", "--check", "packages", "docs"],
]

[env.docs]
description = "Build the unified documentation"
labels = ["docs"]
# The newest Django the classifiers claim: the docs describe what a current install gets.
deps = [
    "Django>=6.1,<6.2",
    "-e {tox_root}/packages/djanquiltdb[docs]",
    # conf.py imports each plugin to read its version, and the API reference imports the libraries that the plugins
    # integrate.
    "celery>=5.6,<6.0",
    "-e {tox_root}/packages/djanquiltdb-plugin-celery",
    "django-oauth-toolkit>=3.4,<4.0",
    "-e {tox_root}/packages/djanquiltdb-plugin-oauth-toolkit",
    "django-pghistory>=3.9.2,<4.0",
    "-e {tox_root}/packages/djanquiltdb-plugin-pghistory",
    "{env:POSTGRES_DENORMALIZE:django-postgres-denormalize>=1.1,<2.0}",
    "-e {tox_root}/packages/djanquiltdb-plugin-postgres-denormalize",
    "django-postgres-objects>=1.1,<2.0",
    "-e {tox_root}/packages/djanquiltdb-plugin-postgres-objects",
]
change_dir = "{tox_root}"
commands = [["sphinx-build", "-b", "html", "-W", "docs", "docs/_build/html"]]

# The gate lives here rather than at the end of each test env, so that narrowing a run to one test with `-- -k Name`
# reports on that run instead of failing it for the coverage the tests you skipped would have contributed.
[env.core-coverage]
description = "Render the HTML report, XML report and summary of the coverage the core test envs recorded"
labels = ["core"]
deps = ["coverage"]
change_dir = "{tox_root}/packages/djanquiltdb/tests"
commands = [
    ["coverage", "combine", "--rcfile={tox_root}/packages/djanquiltdb/pyproject.toml"],
    # CI uploads coverage.xml to Codecov. It is written first and without the gate, so that it exists when coverage is
    # below the gate, which fails html and report.
    ["coverage", "xml", "--fail-under=0", "--rcfile={tox_root}/packages/djanquiltdb/pyproject.toml"],
    ["coverage", "html", "--rcfile={tox_root}/packages/djanquiltdb/pyproject.toml"],
    ["coverage", "report", "--rcfile={tox_root}/packages/djanquiltdb/pyproject.toml"],
]

[env.celery-coverage]
description = "Report on the coverage the celery plugin test envs recorded"
labels = ["celery"]
deps = ["coverage"]
change_dir = "{tox_root}/packages/djanquiltdb-plugin-celery/tests"
commands = [
    # Written first and without the gate, for the reason that the core-coverage env spells out.
    [
        "coverage",
        "xml",
        "--fail-under=0",
        "--rcfile={tox_root}/packages/djanquiltdb-plugin-celery/pyproject.toml",
    ],
    ["coverage", "report", "--rcfile={tox_root}/packages/djanquiltdb-plugin-celery/pyproject.toml"],
]

