[env.ruff]
description = "Lint and check formatting across all packages and the docs"
labels = ["lint"]
deps = ["ruff==0.15.21"]
change_dir = "{tox_root}"
# One cache for the whole tree; without this, ruff drops a .ruff_cache next to every package's config, and inside the
# Docker container those become root-owned.
set_env = { RUFF_CACHE_DIR = "{tox_root}/.ruff_cache" }
commands = [
    ["ruff", "check", "packages", "docs"],
    ["ruff", "format", "--check", "packages", "docs"],
]

[env.docs]
description = "Build the unified documentation"
labels = ["docs"]
# The newest Django the classifiers claim: the docs describe what a current install gets.
deps = [
    "Django>=6.1,<6.2",
    "-e {tox_root}/packages/djanquiltdb[docs]",
    # conf.py imports the plugin for its version, and the plugin imports django-postgres-objects.
    "django-postgres-objects>=1.0,<2.0",
    "-e {tox_root}/packages/djanquiltdb-plugin-postgres-objects",
]
change_dir = "{tox_root}"
commands = [["sphinx-build", "-b", "html", "-W", "docs", "docs/_build/html"]]

# The gate lives here rather than at the end of each test env, so that narrowing a run to one test with `-- -k Name`
# reports on that run instead of failing it for the coverage the tests you skipped would have contributed.
[env.core-coverage]
description = "Render the HTML report and summary of the coverage the core test envs recorded"
labels = ["core"]
deps = ["coverage"]
change_dir = "{tox_root}/packages/djanquiltdb/tests"
commands = [
    ["coverage", "combine", "--rcfile={tox_root}/packages/djanquiltdb/pyproject.toml"],
    ["coverage", "html", "--rcfile={tox_root}/packages/djanquiltdb/pyproject.toml"],
    ["coverage", "report", "--rcfile={tox_root}/packages/djanquiltdb/pyproject.toml"],
]

[env.postgres-objects-coverage]
description = "Report on the coverage the postgres-objects plugin test envs recorded"
labels = ["postgres-objects"]
deps = ["coverage"]
change_dir = "{tox_root}/packages/djanquiltdb-plugin-postgres-objects/tests"
commands = [
    ["coverage", "report", "--rcfile={tox_root}/packages/djanquiltdb-plugin-postgres-objects/pyproject.toml"],
]

[env.core-build]
description = "Build the djanquiltdb sdist and wheel and check the metadata"
labels = ["core", "build"]
deps = ["build", "twine"]
change_dir = "{tox_root}/packages/djanquiltdb"
commands = [
    ["python", "-c", "import shutil; shutil.rmtree('dist', ignore_errors=True)"],
    ["python", "-m", "build"],
    ["twine", "check", "dist/*"],
]

[env.postgres-objects-build]
description = "Build the djanquiltdb-plugin-postgres-objects sdist and wheel and check the metadata"
labels = ["postgres-objects", "build"]
deps = ["build", "twine"]
change_dir = "{tox_root}/packages/djanquiltdb-plugin-postgres-objects"
commands = [
    ["python", "-c", "import shutil; shutil.rmtree('dist', ignore_errors=True)"],
    ["python", "-m", "build"],
    ["twine", "check", "dist/*"],
]
