requires = ["tox>=4.21"]
env_list = [
    "core-py314-dj60-pg17",
    "core-py314-dj60-pg18",
    "core-py314-dj61-pg17",
    "core-py314-dj61-pg18",
    "core-pgtrigger-py314-dj60",
    "core-pgtrigger-py314-dj61",
    "postgres-objects-py314-dj60-pg17",
    "postgres-objects-py314-dj60-pg18",
    "postgres-objects-py314-dj61-pg17",
    "postgres-objects-py314-dj61-pg18",
    "ruff",
    "docs",
    "core-coverage",
    "postgres-objects-coverage",
]

# Every env installs the packages it needs as editable path deps, so pip resolves the plugin's djanquiltdb pin
# against the in-tree checkout and the build backend never writes into the source tree.
[env_run_base]
base_python = ["python3.14"]
skip_install = true
pass_env = ["DATABASE_URL", "DATABASE_URL2"]

# The pg17/pg18 envs pick the pair of database servers from docker-compose.yml; either URL can still be overridden
# from the outside.
[env.core-py314-dj60-pg17]
description = "Run the core test suite against Django 6.0 and PostgreSQL 17"
labels = ["core", "test"]
deps = [
    "Django>=6.0,<6.1",
    "psycopg[binary]>=3.0.0",
    "-e {tox_root}/packages/djanquiltdb[test]",
]
change_dir = "{tox_root}/packages/djanquiltdb/tests"
set_env = { DJANGO_SETTINGS_MODULE = "config.settings.dev", DATABASE_URL = "{env:DATABASE_URL:postgresql://postgres:postgres@postgres17:5432/test_db}", DATABASE_URL2 = "{env:DATABASE_URL2:postgresql://postgres:postgres@postgres17-2:5432/test_db2}" }
commands = [
    [
        "coverage",
        "run",
        "--rcfile={tox_root}/packages/djanquiltdb/pyproject.toml",
        "manage.py",
        "test",
        "--noinput",
        # The test modules are named after what they cover rather than test_*, so discovery needs the wider pattern.
        "--pattern=*.py",
        { replace = "posargs", extend = true, default = [] },
        "--parallel",
    ],
]

