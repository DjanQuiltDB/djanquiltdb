[tox]
envlist =
    py314-dj60-pg17
    py314-dj60-pg18
    ruff
    coverage

[testenv]
usedevelop = True
deps =
    Django>=6.0,<7.0
    psycopg[binary]>=3.0.0
    setuptools>=68

    ; Install the requirements for the test environment
    .[test]

changedir = tests
passenv =
    DATABASE_URL
    DATABASE_URL2
; The pg17/pg18 factors pick the pair of database servers; basepython follows from the py314 factor.
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.dev
    VIRTUALENV_PIP = 23.3.1
    pg17: DATABASE_URL = postgresql://postgres:postgres@postgres17:5432/test_db
    pg17: DATABASE_URL2 = postgresql://postgres:postgres@postgres17-2:5432/test_db2
    pg18: DATABASE_URL = postgresql://postgres:postgres@postgres18:5432/test_db
    pg18: DATABASE_URL2 = postgresql://postgres:postgres@postgres18-2:5432/test_db2
allowlist_externals =
    coverage
commands =
    coverage run manage.py test --noinput {posargs} --parallel

[testenv:ruff]
deps =
    -e .[lint]
skip_install = true
changedir = {toxinidir}
allowlist_externals =
    ruff
commands =
    - ruff check src tests ../../docs
    - ruff format --check src tests ../../docs

[testenv:coverage]
deps =
    coverage
skip_install = true
changedir = tests
allowlist_externals =
    coverage
    python
commands =
    - coverage html
    python {toxinidir}/coverage.py
